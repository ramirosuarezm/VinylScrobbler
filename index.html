<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Scrobbleá a Last.fm los vinilos de tu colección de Discogs.">
<title>VinylScrobbler</title>
<meta name="theme-color" content="#f5f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#100f0e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://api.discogs.com">
<link rel="preconnect" href="https://i.discogs.com">
<link rel="stylesheet" href="styles.css">
<script>
/* Tema antes del primer pintado, para evitar el flash */
try{
  var t=localStorage.getItem('theme');
  var dark=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme=dark?'dark':'light';
}catch(e){}
</script>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <div class="disc" aria-hidden="true"></div>
      <span class="logo-name">Vinyl<span>Scrobbler</span></span>
    </div>
    <div class="hdr-right">
      <span class="offline-dot" title="Sin conexión"></span>
      <button class="icon-btn" data-act="theme" aria-label="Cambiar tema" id="themeBtn">🌙</button>
    </div>
  </header>

  <main>
    <!-- ============ Colección ============ -->
    <section class="page active" id="page-collection" aria-label="Colección">
      <div class="bar">
        <h1 class="page-title">Mi colección</h1>
        <div class="bar-right">
          <span class="count-pill" id="countPill">— discos</span>
          <button class="refresh-btn" data-act="reload" id="reloadBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Actualizar
          </button>
        </div>
      </div>
      <div class="filters">
        <div class="srch-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="srch-input" id="srchInput" type="search" placeholder="Buscar artista o título…" aria-label="Buscar en la colección" autocomplete="off" spellcheck="false" enterkeyhint="search">
        </div>
        <select class="sort-sel" id="sortSel" aria-label="Ordenar colección">
          <option value="artist">Artista</option>
          <option value="title">Título</option>
          <option value="year">Año ↓</option>
          <option value="added">Agregados ↓</option>
        </select>
      </div>
      <div id="colContent"></div>
    </section>

    <!-- ============ Historial ============ -->
    <section class="page" id="page-history" aria-label="Historial">
      <div class="bar">
        <h1 class="page-title">Historial</h1>
        <button class="link-btn" data-act="clear-hist" id="clearHistBtn" hidden>Borrar</button>
      </div>
      <div id="histContent"></div>
    </section>

    <!-- ============ Ajustes ============ -->
    <section class="page" id="page-settings" aria-label="Ajustes">
      <h1 class="page-title">Ajustes</h1>

      <div class="sec-card">
        <div class="sec-label">Discogs</div>
        <div class="field">
          <label for="dUser">Usuario</label>
          <input type="text" id="dUser" placeholder="tu_usuario" autocomplete="username" autocorrect="off" autocapitalize="none" spellcheck="false">
        </div>
        <div class="field">
          <label for="dToken">Token personal</label>
          <input type="password" id="dToken" placeholder="••••••••••••••••" autocomplete="off">
          <a class="field-hint" href="https://www.discogs.com/settings/developers" target="_blank" rel="noopener">→ Obtener en discogs.com/settings/developers</a>
        </div>
        <div class="st-row" id="dStatus"><span class="st-dot"></span><span id="dMsg"></span></div>
        <button class="btn btn-out" data-act="test-discogs">Verificar conexión</button>
      </div>

      <div class="sec-card">
        <div class="sec-label">Last.fm</div>
        <div class="field">
          <label for="lKey">API Key</label>
          <input type="text" id="lKey" placeholder="32 caracteres" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
        </div>
        <div class="field">
          <label for="lSecret">Shared Secret</label>
          <input type="password" id="lSecret" placeholder="••••••••••••••••" autocomplete="off">
          <a class="field-hint" href="https://www.last.fm/api/account/create" target="_blank" rel="noopener">→ Crear app en last.fm/api/account/create</a>
        </div>
        <div class="field">
          <label for="lUser">Usuario</label>
          <input type="text" id="lUser" placeholder="tu_usuario" autocomplete="username" autocorrect="off" autocapitalize="none" spellcheck="false">
        </div>
        <div class="field">
          <label for="lPass">Contraseña</label>
          <input type="password" id="lPass" placeholder="solo la primera vez" autocomplete="current-password">
        </div>
        <div class="st-row" id="lStatus"><span class="st-dot"></span><span id="lMsg"></span></div>
        <p class="note">La contraseña se usa una sola vez para pedir la clave de sesión a Last.fm y no se guarda en el dispositivo.</p>
        <button class="btn btn-out" data-act="test-lastfm" style="margin-top:12px">Verificar conexión</button>
        <button class="btn btn-red" data-act="save">Guardar configuración</button>
      </div>

      <div class="sec-card">
        <div class="sec-label">Datos locales</div>
        <p class="note" id="cacheInfo" style="margin-top:0"></p>
        <button class="btn btn-out" data-act="clear-cache" style="margin-top:12px">Vaciar caché de la colección</button>
        <button class="btn btn-out" data-act="logout" style="margin-bottom:0">Borrar credenciales</button>
      </div>
    </section>
  </main>

  <nav>
    <button id="nav-collection" data-page="collection" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      Colección
    </button>
    <button id="nav-history" data-page="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Historial
    </button>
    <button id="nav-settings" data-page="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Ajustes
    </button>
  </nav>
</div>

<!-- ============ Detalle del disco ============ -->
<dialog class="sheet" id="sheet" aria-labelledby="shTitle">
  <div class="sh-topbar">
    <span class="sh-spacer"></span>
    <span class="sh-handle" aria-hidden="true"></span>
    <button class="sh-close" data-act="close-sheet" aria-label="Cerrar">✕</button>
  </div>
  <div class="sh-scroll">
    <div class="sh-head">
      <span class="sh-cover-wrap"><img class="sh-cover" id="shCover" src="" alt="" width="72" height="72"></span>
      <div class="sh-meta">
        <h2 class="sh-title" id="shTitle"></h2>
        <div class="sh-artist" id="shArtist"></div>
        <div class="sh-year" id="shYear"></div>
      </div>
    </div>
    <div class="tr-hdr">
      <span class="tr-label">Tracks</span>
      <button class="link-btn" id="selAllBtn" data-act="toggle-all">Deseleccionar todo</button>
    </div>
    <div id="trackList"></div>
  </div>
  <div class="sh-foot">
    <p class="sel-count" id="selCount"></p>
    <button class="btn btn-red" id="scrobbleBtn" data-act="scrobble">Scrobblear</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js" defer></script>
</body>
</html>
